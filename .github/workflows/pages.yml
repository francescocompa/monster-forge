name: Deploy to GitHub Pages

# Replaces the legacy branch-based Pages build (which started erroring/hanging on deploy —
# see CHANGELOG B285 follow-up). This is a no-build static site (DEVELOPMENT.md): the checkout
# IS the site, served as-is, so this workflow just uploads the repo root and deploys it.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
